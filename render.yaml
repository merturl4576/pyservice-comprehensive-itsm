services:
  - type: web
    name: pyservice
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r pyservice/requirements.txt && cd pyservice && python manage.py collectstatic --noinput && python manage.py migrate && python setup_tenants.py
    startCommand: cd pyservice && daphne -b 0.0.0.0 -p $PORT pyservice.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: pyservice-db
          property: connectionString

databases:
  - name: pyservice-db
    databaseName: pyservice
    user: pyservice
    plan: free
    region: frankfurt
